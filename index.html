<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyHitster App</title>
    <!-- HTML5 QR Code Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        h1 { color: #1DB954; }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button {
            background-color: #1DB954;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
        button:hover { background-color: #1ed760; }
        #scanner-container { display: none; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 20px; background: #000; }
        #status { margin-top: 20px; font-weight: bold; color: #1DB954; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>MyHitster</h1>
        
        <!-- Login Bereich -->
        <div id="login-container">
            <p>Bitte logge dich mit Spotify ein, um die App zu nutzen. (Spotify Premium erforderlich)</p>
            <button id="login-btn">Mit Spotify einloggen</button>
        </div>

        <!-- Scanner Bereich -->
        <div id="scanner-container">
            <p>Scanne eine Karte, um das Lied abzuspielen.</p>
            <div id="reader"></div>
            <button id="logout-btn" style="background-color: #535353; margin-top: 30px;">Ausloggen</button>
        </div>

        <div id="status"></div>
    </div>

    <script>
        // ==========================================
        // 1. KONFIGURATION (HIER DEINE DATEN EINTRAGEN)
        // ==========================================
        const clientId = '733c8523943b4538836296357307fdd3'; // Ersetze dies mit deiner Spotify Client ID
        const redirectUri = window.location.origin + window.location.pathname; // Automatische Redirect-URL (z.B. https://deinname.github.io/hitster/)
        
        // ==========================================
        // 2. SONG DATENBANK (QR-CODE IDs -> SPOTIFY URIs)
        // ==========================================
        const songDatabase = {
            "song_001": "spotify:track:4cOdK2wGLETKBW3PvgPWqT", // Rick Astley - Never Gonna Give You Up
            "song_002": "spotify:track:3AJwUDP919kvQ9QcozQPxg", // Coldplay - Yellow
            "song_003": "spotify:track:4u7EnebtmKWzUH433cf5Qv"  // Queen - Bohemian Rhapsody
            // Weitere Lieder hier hinzufügen...
        };

        // ==========================================
        // 3. UI & STATUS MANAGEMENT
        // ==========================================
        const loginContainer = document.getElementById('login-container');
        const scannerContainer = document.getElementById('scanner-container');
        const statusDiv = document.getElementById('status');
        let html5QrcodeScanner = null;

        function showStatus(message, isError = false) {
            statusDiv.textContent = message;
            statusDiv.style.color = isError ? '#ff4444' : '#1DB954';
            setTimeout(() => { statusDiv.textContent = ''; }, 5000);
        }

        // ==========================================
        // 4. SPOTIFY PKCE AUTHENTIFIZIERUNG
        // ==========================================
        const generateRandomString = (length) => {
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const values = crypto.getRandomValues(new Uint8Array(length));
            return values.reduce((acc, x) => acc + possible[x % possible.length], "");
        };

        const sha256 = async (plain) => {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            return window.crypto.subtle.digest('SHA-256', data);
        };

        const base64encode = (input) => {
            return btoa(String.fromCharCode(...new Uint8Array(input)))
                .replace(/=/g, '')
                .replace(/\+/g, '-')
                .replace(/\//g, '_');
        };

        document.getElementById('login-btn').addEventListener('click', async () => {
            const codeVerifier = generateRandomString(64);
            window.localStorage.setItem('code_verifier', codeVerifier);
            const hashed = await sha256(codeVerifier);
            const codeChallenge = base64encode(hashed);

            const scope = 'user-modify-playback-state';
            const authUrl = new URL("https://accounts.spotify.com/authorize");
            window.localStorage.setItem('redirect_uri', redirectUri);

            const params = {
                response_type: 'code',
                client_id: clientId,
                scope: scope,
                code_challenge_method: 'S256',
                code_challenge: codeChallenge,
                redirect_uri: redirectUri,
            };

            authUrl.search = new URLSearchParams(params).toString();
            window.location.href = authUrl.toString();
        });

        const getToken = async (code) => {
            const codeVerifier = localStorage.getItem('code_verifier');
            const storedRedirectUri = localStorage.getItem('redirect_uri') || redirectUri;

            const payload = {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    client_id: clientId,
                    grant_type: 'authorization_code',
                    code: code,
                    redirect_uri: storedRedirectUri,
                    code_verifier: codeVerifier,
                }),
            };

            try {
                const body = await fetch("https://accounts.spotify.com/api/token", payload);
                const response = await body.json();
                
                if (response.access_token) {
                    localStorage.setItem('spotify_access_token', response.access_token);
                    // URL bereinigen (Code verstecken)
                    window.history.replaceState({}, document.title, window.location.pathname);
                    initApp();
                } else {
                    showStatus("Fehler beim Login.", true);
                }
            } catch (error) {
                console.error('Token fetch error:', error);
                showStatus("Netzwerkfehler beim Login.", true);
            }
        };

        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('spotify_access_token');
            window.location.reload();
        });

        // ==========================================
        // 5. QR SCANNER & PLAYBACK LOGIK
        // ==========================================
        async function playOnSpotify(uri) {
            const accessToken = localStorage.getItem('spotify_access_token');
            showStatus("Starte Wiedergabe...");

            try {
                const response = await fetch('https://api.spotify.com/v1/me/player/play', {
                    method: 'PUT',
                    body: JSON.stringify({ uris: [uri] }),
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`
                    },
                });

                if (response.ok || response.status === 204) {
                    showStatus("🎵 Lied läuft!");
                } else {
                    const errorData = await response.json();
                    console.error("Spotify API Error:", errorData);
                    if (response.status === 403) {
                        showStatus("Fehler: Premium nötig oder kein aktives Gerät.", true);
                    } else if (response.status === 404) {
                        showStatus("Fehler: Bitte öffne Spotify zuerst auf deinem Handy!", true);
                    } else {
                        showStatus("Fehler beim Abspielen.", true);
                    }
                }
            } catch (error) {
                console.error("Playback Error:", error);
                showStatus("Netzwerkfehler beim Abspielen.", true);
            }

            // Scanner nach 3 Sekunden wieder freigeben
            setTimeout(() => {
                if(html5QrcodeScanner) html5QrcodeScanner.resume();
            }, 3000);
        }

        function onScanSuccess(decodedText) {
            console.log(`Scan erfolgreich: ${decodedText}`);
            html5QrcodeScanner.pause();
            
            const spotifyUri = songDatabase[decodedText];
            if (spotifyUri) {
                playOnSpotify(spotifyUri);
            } else {
                showStatus(`Unbekannter QR-Code: ${decodedText}`, true);
                setTimeout(() => { html5QrcodeScanner.resume(); }, 2000);
            }
        }

        function initApp() {
            loginContainer.style.display = 'none';
            scannerContainer.style.display = 'block';

            if (!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5QrcodeScanner(
                    "reader", 
                    { fps: 10, qrbox: { width: 250, height: 250 } }, 
                    false
                );
                html5QrcodeScanner.render(onScanSuccess, (error) => { /* Ignorieren */ });
            }
        }

        // ==========================================
        // 6. START-LOGIK (Beim Laden der Seite)
        // ==========================================
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const token = localStorage.getItem('spotify_access_token');

            if (code) {
                // Wir kommen vom Spotify Login zurück
                getToken(code);
            } else if (token) {
                // Wir sind bereits eingeloggt
                initApp();
            } else {
                // Nicht eingeloggt
                loginContainer.style.display = 'block';
            }
        });
    </script>
</body>
</html>
